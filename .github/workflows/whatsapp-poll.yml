name: WhatsApp Bridge Poll

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout brain-tools
        uses: actions/checkout@v4
        with:
          repository: brilenkov/brain-tools
          token: ${{ secrets.GH_PAT }}
          path: bridge

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install chromium + zip + unzip + p7zip
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq chromium-browser unzip p7zip-full zip
          echo "Chromium: $(which chromium-browser || which chromium)"

      - name: Install npm deps
        run: |
          cd bridge/bots/chat-monitor-bot/whatsapp_bridge
          npm install --production

      - name: Download session from GitHub
        run: |
          cd bridge/bots/chat-monitor-bot/whatsapp_bridge
          curl -sL -H "Authorization: token ${{ secrets.GH_PAT }}" \
            -o /tmp/session.zip \
            "https://raw.githubusercontent.com/brilenkov/whatsapp-bridge-session/main/session.zip"
          ls -la /tmp/session.zip
          mkdir -p .wweb_auth
          7z x /tmp/session.zip -o.wweb_auth -y 2>/dev/null || unzip -o /tmp/session.zip -d .wweb_auth
          echo "Session files: $(find .wweb_auth -type f | wc -l)"

      - name: Run WhatsApp bridge (300s)
        env:
          CHAT_MONITOR_URL: ${{ secrets.CHAT_MONITOR_URL }}
          CHAT_MONITOR_TOKEN: ${{ secrets.CHAT_MONITOR_TOKEN }}
          CHAT_MONITOR_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          ADMIN_TG_ID: ${{ secrets.ADMIN_TG_ID }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
          PUPPETEER_EXECUTABLE_PATH: '/usr/bin/chromium-browser'
          SESSION_REPO: 'brilenkov/whatsapp-bridge-session'
          GITHUB_PAT: ${{ secrets.GH_PAT }}
          ACCOUNT_NAME: 'alexey_brilenkov'
          BRIDGE_RUN_SECONDS: '300'
          SAVE_SESSION: 'true'
          RENDER: 'true'
          RENDER_EXTERNAL_URL: 'https://github.com'
        run: |
          cd bridge/bots/chat-monitor-bot/whatsapp_bridge
          node index.js 2>&1 | tee bridge.log || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bridge-logs
          path: bridge/bots/chat-monitor-bot/whatsapp_bridge/bridge.log
          retention-days: 3
